<div class="versionSelector">
    <form>
        <label for="sgVersion">Docs Version</label>
        <select name="sgVersion" id="sgVersion">
        {{- range .Site.Data.doc_versions.versions }}
            <option value="{{ .path | relURL }}"{{ if .current }} selected{{ end }}>{{ .name }}{{ if .development }} (development){{ end }}</option>
        {{- end }}
        </select>
        
        {{ if .Site.Params.isDevVersion }}
            <p class="warning textLeft smText">
                The version you're browsing is currently under development and may be subject to changes in functionality.
            </p>
        {{ end }}
    </form>
</div>
<hr/>
<div class="searchbox">
    <label for="search-by"><i class="fas fa-search"></i></label>
    <input data-search-input id="search-by" type="search" placeholder="{{T "Search-placeholder"}}">
    <span data-search-clear=""><i class="fas fa-times"></i></span>
</div>
{{ $assetBusting := not .Site.Params.disableAssetsBusting }}
<script type="text/javascript" src="{{"js/lunr.min.js" | relURL}}{{ if $assetBusting }}?{{ now.Unix }}{{ end }}"></script>
<script type="text/javascript" src="{{"js/auto-complete.js" | relURL}}{{ if $assetBusting }}?{{ now.Unix }}{{ end }}"></script>
<script type="text/javascript">
    {{/* the search index (index.json) is an output of the doc section root,
         not of the site home */}}
    var baseurl = "{{ .FirstSection.Permalink }}";
</script>
<script type="text/javascript" src="{{"js/search.js" | relURL}}{{ if $assetBusting }}?{{ now.Unix }}{{ end }}"></script>
