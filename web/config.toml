title = "StackGres"
baseURL = "https://stackgres.io"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
theme = ["stackgres", "sg-doc"]
enableEmoji = true
enableRobotsTXT = true
summaryLength = 30
# ignoreErrors = ["error-disable-taxonomy"]
# splice sources for scripts/generate-docs.sh, not pages (their url: would
# collide with the generated _index.md)
ignoreFiles = ['_index\.template\.md$']

# lunr search index of the docs section (fetched by js/search.js), emitted at
# /doc/latest/search-index.json by the doc root's outputs front matter
[outputFormats.SearchIndex]
  mediaType = "application/json"
  baseName = "search-index"

[taxonomies]
    planet = "planet"
    tag = "tags"
    author = "author"

[params]
    # draft site: keep search engines out — remove before production launch
    noindex = true
    placeholder = "img/placeholder.png"
    # sg-doc (docs) theme params — carried over from the docs site's own config
    showVisitedLinks = false
    disableBreadcrumb = false
    disableNextPrev = true
    themeVariant = "stackgres"
    DisableShortcutsTitle = true
    isDevVersion = false
    companyname = "StackGres"
    twitter = "@OnGresINC"
    projectName = "StackGres"

    # NOTE: subtables must stay LAST in [params] — any plain key written after
    # a [params.x] table header silently becomes params.x.key (TOML), which
    # broke projectName/themeVariant/placeholder for weeks
    [params.hubspot]
        portalId = "149027957"
        formId = "2d7f94a7-acd0-4cbc-8c3e-c39fd1ae14bd"
        region = "eu1"

