<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2020 1455" role="img" aria-labelledby="sgpTitle" style="width:100%;max-width:2020px;height:auto">
  <title id="sgpTitle">Anatomy of the pod: Envoy, PgBouncer, Patroni and Postgres with their sidecars, linked over Unix domain sockets</title>
  <defs>
    <linearGradient id="sgpBox" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#42f0cf"/>
      <stop offset="1" stop-color="#36a8ff"/>
    </linearGradient>
    <linearGradient id="sgpFrame" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#42f0cf"/>
      <stop offset="1" stop-color="#36a8ff"/>
    </linearGradient>
    <linearGradient id="sgpUds" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd84d"/>
      <stop offset="1" stop-color="#f2a130"/>
    </linearGradient>
    <marker id="sgpB" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L8 5 L1 9" fill="none" stroke="#36a8ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    .sgpT { font-size: 36px; font-weight: 500; fill: currentColor; text-anchor: middle; }
    .sgpS { font-size: 30px; font-weight: 500; fill: currentColor; }
    .sgpP { font-size: 34px; font-weight: 500; fill: currentColor; text-anchor: middle; }
    .sgpH { font-size: 40px; font-weight: 700; fill: currentColor; text-anchor: middle; }
  </style>

  <rect x="305" y="155" width="1335" height="1290" rx="10" fill="none" stroke="url(#sgpFrame)" stroke-width="5" stroke-dasharray="30 22"/>

  <text class="sgpT" x="440" y="70">To</text>
  <text class="sgpT" x="440" y="112">Replicas</text>
  <path d="M1045 205 C 900 60, 700 48, 538 80" fill="none" stroke="#42f0cf" stroke-width="4" stroke-linecap="round"/>
  <text class="sgpP" transform="translate(800 42) rotate(-7)">Postgres repl. port 5433</text>
  <path d="M1125 205 C 1185 90, 1300 68, 1415 84" fill="none" stroke="#36a8ff" stroke-width="4" stroke-linecap="round"/>
  <text class="sgpP" transform="translate(1280 40) rotate(-6)">Postgres port 5432</text>
  <text class="sgpT" x="1525" y="70">To</text>
  <text class="sgpT" x="1525" y="112">Clients</text>

  <rect x="975" y="210" width="230" height="210" rx="16" fill="none" stroke="url(#sgpBox)" stroke-width="5"/>
