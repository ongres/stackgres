  <text class="sgpT" x="1105" y="344">Proxy</text>
  <rect x="992" y="286" width="24" height="24" rx="5" fill="url(#sgpUds)"/>
  <text class="sgpS" transform="rotate(-90 1012 390)" x="1012" y="390">UDS</text>
  <rect x="1078" y="372" width="24" height="24" rx="5" fill="url(#sgpUds)"/>
  <text class="sgpS" x="1114" y="394">UDS</text>
  <path d="M1208 295 C 1430 258, 1580 262, 1760 298" fill="none" stroke="#36a8ff" stroke-width="4" stroke-linecap="round" marker-end="url(#sgpB)"/>
  <text class="sgpT" x="1898" y="278">To</text>
  <text class="sgpT" x="1898" y="320">Prometheus</text>

  <rect x="975" y="480" width="230" height="180" rx="16" fill="none" stroke="url(#sgpBox)" stroke-width="5"/>
  <rect x="1078" y="466" width="24" height="24" rx="5" fill="url(#sgpUds)"/>
  <text class="sgpS" x="1114" y="488">UDS</text>
  <text class="sgpT" x="1090" y="585">PgBouncer</text>
  <rect x="1078" y="646" width="24" height="24" rx="5" fill="url(#sgpUds)"/>
