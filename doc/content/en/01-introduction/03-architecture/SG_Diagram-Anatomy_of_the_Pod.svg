    <line x1="820" y1="940" x2="880" y2="940"/>
    <line x1="820" y1="972" x2="880" y2="972"/>
    <line x1="820" y1="1004" x2="880" y2="1004"/>
  </g>
  <g fill="#36a8ff">
    <circle cx="800" cy="940" r="5"/>
    <circle cx="800" cy="972" r="5"/>
    <circle cx="800" cy="1004" r="5"/>
  </g>
  <text class="sgpP" x="845" y="1050">Logs</text>

  <rect x="355" y="605" width="235" height="135" rx="12" fill="none" stroke="url(#sgpBox)" stroke-width="4"/>
  <text class="sgpP" x="472" y="662">Backup</text>
  <text class="sgpP" x="472" y="702">Agent (Job)</text>
  <text class="sgpP" x="160" y="650">To S3, GCS,</text>
  <text class="sgpP" x="160" y="690">Azure Blob,</text>
  <text class="sgpP" x="160" y="730">MinIO, &#8230;</text>
  <path d="M350 672 C 320 662, 300 660, 278 666" fill="none" stroke="#36a8ff" stroke-width="4" stroke-linecap="round" marker-end="url(#sgpB)"/>

  <rect x="355" y="825" width="235" height="165" rx="12" fill="none" stroke="url(#sgpBox)" stroke-width="4"/>
  <text class="sgpP" x="472" y="893">Local Pod</text>
  <text class="sgpP" x="472" y="936">Controller</text>

  <rect x="355" y="1080" width="235" height="135" rx="12" fill="none" stroke="url(#sgpBox)" stroke-width="4"/>
  <text class="sgpP" x="472" y="1158">Fluent-bit</text>
  <text class="sgpP" x="122" y="1125">Send logs</text>
  <text class="sgpP" x="122" y="1165">to Fluentd</text>
  <path d="M350 1145 C 320 1135, 300 1133, 278 1139" fill="none" stroke="#36a8ff" stroke-width="4" stroke-linecap="round" marker-end="url(#sgpB)"/>

  <g fill="none" stroke="#5cc8f7" stroke-width="3.5" stroke-linecap="round">
    <path d="M592 690 C 662 710, 700 748, 733 792"/>
    <path d="M592 900 C 652 906, 692 906, 733 902"/>
    <path d="M592 1130 C 682 1096, 732 1042, 790 1006"/>
  </g>

  <rect x="1305" y="715" width="270" height="165" rx="12" fill="none" stroke="url(#sgpBox)" stroke-width="4"/>
  <rect x="1293" y="782" width="24" height="24" rx="5" fill="url(#sgpUds)"/>
  <text class="sgpS" transform="rotate(-90 1313 885)" x="1313" y="885">UDS</text>
  <text class="sgpP" x="1452" y="785">Postgres</text>
  <text class="sgpP" x="1452" y="828">Util</text>
  <rect x="1305" y="945" width="270" height="165" rx="12" fill="none" stroke="url(#sgpBox)" stroke-width="4"/>
  <rect x="1293" y="1012" width="24" height="24" rx="5" fill="url(#sgpUds)"/>
  <text class="sgpS" transform="rotate(-90 1313 1115)" x="1313" y="1115">UDS</text>
  <text class="sgpP" x="1452" y="1015">Postgres</text>
  <text class="sgpP" x="1452" y="1058">Exporter</text>
  <g fill="none" stroke="#ffd84d" stroke-width="4" stroke-linecap="round">
    <path d="M1084 806 C 1180 812, 1240 800, 1290 794"/>
    <path d="M1082 816 C 1130 900, 1200 990, 1290 1022"/>
  </g>
  <path d="M1578 1010 C 1660 990, 1710 990, 1758 1008" fill="none" stroke="#36a8ff" stroke-width="4" stroke-linecap="round" marker-end="url(#sgpB)"/>
  <text class="sgpT" x="1898" y="992">To</text>
  <text class="sgpT" x="1898" y="1034">Prometheus</text>

  <path d="M970 1078 C 958 1130, 958 1170, 967 1205" fill="none" stroke="#36a8ff" stroke-width="4" stroke-linecap="round"/>
  <text class="sgpS" transform="rotate(-75 1008 1150)" x="1008" y="1150">PVC</text>
  <g fill="none" stroke="#36a8ff" stroke-width="6" stroke-linecap="round">
    <path d="M936 1245 v62 a34 13 0 0 0 68 0 v-62"/>
    <ellipse cx="970" cy="1245" rx="34" ry="13"/>
    <path d="M936 1268 a34 13 0 0 0 68 0"/>
    <path d="M936 1290 a34 13 0 0 0 68 0"/>
  </g>
  <text class="sgpT" x="970" y="1382">PV</text>
  <text class="sgpP" x="970" y="1432">(EBS, PD, &#8230;)</text>
