    <rect x="10" y="1425" width="640" height="370" rx="22" fill="none" stroke="url(#scOrange)" stroke-width="10"/>
    <use href="#scCylC" x="165" y="1595"/>
    <text class="scRole" x="165" y="1770">P</text>
    <path d="M250 1580 C 300 1545, 400 1545, 450 1580" fill="none" stroke="#c43bf0" stroke-width="8" stroke-linecap="round" marker-end="url(#scPurple)"/>
    <use href="#scCylB" x="505" y="1595"/>
    <text class="scRole" x="505" y="1770">R</text>
  </g>
  <g id="scShard1">
    <text class="scName" x="1155" y="1390">cluster-shard1</text>
    <rect x="835" y="1425" width="640" height="370" rx="22" fill="none" stroke="url(#scOrange)" stroke-width="10"/>
    <use href="#scCylC" x="990" y="1595"/>
    <text class="scRole" x="990" y="1770">P</text>
    <path d="M1075 1580 C 1125 1545, 1225 1545, 1275 1580" fill="none" stroke="#c43bf0" stroke-width="8" stroke-linecap="round" marker-end="url(#scPurple)"/>
    <use href="#scCylB" x="1330" y="1595"/>
    <text class="scRole" x="1330" y="1770">R</text>
  </g>
  <g id="scShard2">
    <text class="scName" x="1975" y="1390">cluster-shard2</text>
    <rect x="1655" y="1425" width="640" height="370" rx="22" fill="none" stroke="url(#scOrange)" stroke-width="10"/>
    <use href="#scCylC" x="1810" y="1595"/>
    <text class="scRole" x="1810" y="1770">P</text>
    <path d="M1895 1580 C 1945 1545, 2045 1545, 2095 1580" fill="none" stroke="#c43bf0" stroke-width="8" stroke-linecap="round" marker-end="url(#scPurple)"/>
    <use href="#scCylB" x="2150" y="1595"/>
    <text class="scRole" x="2150" y="1770">R</text>
  </g>
  <g id="scShard3">
    <text class="scName" x="2800" y="1390">cluster-shard3</text>
    <rect x="2480" y="1425" width="640" height="370" rx="22" fill="none" stroke="url(#scOrange)" stroke-width="10"/>
    <use href="#scCylC" x="2635" y="1595"/>
    <text class="scRole" x="2635" y="1770">P</text>
    <path d="M2720 1580 C 2770 1545, 2870 1545, 2920 1580" fill="none" stroke="#c43bf0" stroke-width="8" stroke-linecap="round" marker-end="url(#scPurple)"/>
    <use href="#scCylB" x="2975" y="1595"/>
    <text class="scRole" x="2975" y="1770">R</text>
  </g>
