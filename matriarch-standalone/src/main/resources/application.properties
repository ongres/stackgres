# Scan all dependencies (incl. proto-google-common-protos) for importable protos
# so api.v1's `import "google/rpc/status.proto"` resolves at codegen. Build-time.
quarkus.generate-code.grpc.scan-for-imports=all

# Example local-matriarch gRPC endpoint. Separate gRPC server, plaintext, so a
# bare `grpcurl -plaintext` works against it.
quarkus.grpc.server.use-separate-server=true
quarkus.grpc.server.host=0.0.0.0
quarkus.grpc.server.port=9000
quarkus.grpc.server.plain-text=true
# Enable server reflection so `grpcurl ... list/describe` works without -proto.
quarkus.grpc.server.enable-reflection-service=true

# gRPC client used by the test (and handy for local experiments).
quarkus.grpc.clients.stackgres.host=localhost
quarkus.grpc.clients.stackgres.port=9000
quarkus.grpc.clients.stackgres.plain-text=true

# Cloud uplink. Opt-in by setting the endpoint + token env vars (same names the CLI uses):
#   STACKGRES_ENDPOINT_URL=stackgres-cloud.example.com:443   (empty = uplink disabled)
#   STACKGRES_TOKEN=<jwt>
stackgres.cloud.heartbeat-interval=5s
# Environment identity. Set an explicit id (from outside — env var / this deployment's .env) to keep a
# stable id across restarts; e.g. STACKGRES_CLOUD_ENVIRONMENT_ID=my-env. If left UNSET, a fresh unique
# id is generated at startup (4 random bytes, base64, 6 chars — like the operator's installation id),
# but it is ephemeral and changes on every restart.
# stackgres.cloud.environment.id=
stackgres.cloud.environment.kind=KIND_BARE_METAL

# The durable state store. 'memory' (default, non-durable, dev) or 'sqlite' (a local file that survives restarts).
# The observed status is always in-memory.
matriarch.store=sqlite
matriarch.store.sqlite.path=matriarch.db
# The per-cluster event history for `cluster events` is a separate, bounded, best-effort table in this
# SAME file (durable when sqlite, else in-memory) — not a separate store.
# Credentials are encrypted at rest (AES-256-GCM) and the DB files are 0600. The key comes from
# matriarch.secret.key (base64, ideally injected at runtime) or, if unset, an auto-generated 0600 keyfile
# next to the DB (<path>.key). Set the key out-of-band to keep it off the DB's disk.
# matriarch.secret.key=<base64-32-bytes>

%dev.quarkus.log.category."io.stackgres".level=DEBUG