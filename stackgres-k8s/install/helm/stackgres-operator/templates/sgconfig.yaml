{{- if .Values.deploy.operator }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  namespace: {{ .Release.Namespace }}
  name: "{{ .Release.Name }}-sgconfig-crd"
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade,post-upgrade # Remove post-upgrade after version 1.13 get out of support
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "helm.sh/hook-weight": "9"
data:
  SGConfig.yaml: |
    {{ .Files.Get "crds/SGConfig.yaml" | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  namespace: {{ .Release.Namespace }}
  name: "{{ .Release.Name }}-sgconfig"
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade,post-upgrade # Remove post-upgrade after version 1.13 get out of support
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "helm.sh/hook-weight": "9"
data:
  sgconfig.json: |
    apiVersion: stackgres.io/v1
    kind: SGConfig
    metadata:
      name: {{ .Release.Name }}
      namespace: {{ .Values.sgConfigNamespace | default .Release.Namespace }}
    {{- $spec := dict }}
    {{- range .Values.specFields }}
    {{- $spec := set $spec . (index $.Values .) }}
    {{- end }}
    {{- if .Values.extensions.cache.enabled }}
    {{- $proxyUrl := printf "proxyUrl=http%%3A%%2F%%2F%s-extensions-cache.%s%%3FsetHttpScheme%%3Dtrue&retry=3%%3A5" $.Release.Name $.Release.Namespace }}
    {{- $repositoryUrls := list }}
    {{- range .Values.extensions.repositoryUrls }}
    {{- $base := . }}
    {{- $params := list }}
    {{- if contains "?" . }}
    {{- $base = (splitn "?" 2 .)._0 }}
    {{- range splitList "&" (splitn "?" 2 .)._1 }}
    {{- if and (ne . "") (not (hasPrefix "proxyUrl=" .)) }}
    {{- $params = append $params . }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- $params = append $params $proxyUrl }}
    {{- $repositoryUrls = append $repositoryUrls (printf "%s?%s" $base (join "&" $params)) }}
    {{- end }}
    {{- $extensions := deepCopy (index $spec "extensions") }}
    {{- $_ := set $extensions "repositoryUrls" $repositoryUrls }}
    {{- $_ := set $spec "extensions" $extensions }}
    {{- end }}
    {{- if .Values.repository.cache.enabled }}
    {{- $repository := deepCopy (index $spec "repository") }}
    {{- $_ := set $repository "url" (printf "http://%s-docir-cache.%s" $.Release.Name $.Release.Namespace) }}
    {{- $_ := set $spec "repository" $repository }}
    {{- end }}
    spec: {{ toJson $spec }}
---
apiVersion: batch/v1
kind: Job
metadata:
  namespace: {{ .Release.Namespace }}
  name: "{{ .Release.Name }}-install-sgconfig"
  labels:
    app: stackgres-operator-init
    job: install-sgconfig
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade,post-upgrade # Remove post-upgrade after version 1.13 get out of support
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "helm.sh/hook-weight": "10"
    {{- with .Values.jobs.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: stackgres-operator-init
        job: install-sgconfig
    spec:
      serviceAccountName: {{ .Release.Name }}-init
      restartPolicy: OnFailure
      terminationGracePeriodSeconds: 0
      {{- with .Values.jobs.schedulerName }}
      schedulerName: {{ . }}
      {{- end }}
      {{- with .Values.jobs.runtimeClassName }}
      runtimeClassName: {{ . }}
      {{- end }}
      {{- with .Values.jobs.preemptionPolicy }}
      preemptionPolicy: {{ . }}
      {{- end }}
      {{- with .Values.jobs.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.jobs.affinity}}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end}}
      {{- with .Values.jobs.nodeSelector}}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.jobs.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: "install-sgconfig"
        image: {{ template "kubectl-image" . }}
        imagePullPolicy: "IfNotPresent"
        {{- with .Values.jobs.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        command:
          - "/bin/bash"
          - "-ecx"
          - |
            kubectl replace -f /SGConfig.yaml
            RETRY=10
            while true
            do
              if kubectl apply -f /sgconfig.json
              then
                break
              else
                if [ "$RETRY" -le 0 ]
                then
                  exit 1
                fi
                RETRY="$((RETRY - 1))"
                sleep 2
              fi
            done
        volumeMounts:
        - name: sgconfig-crd
          mountPath: /SGConfig.yaml
          subPath: SGConfig.yaml
        - name: sgconfig
          mountPath: /sgconfig.json
          subPath: sgconfig.json
      volumes:
      - name: sgconfig-crd
        configMap:
          name: "{{ .Release.Name }}-sgconfig-crd"
          optional: false
      - name: sgconfig
        configMap:
          name: "{{ .Release.Name }}-sgconfig"
          optional: false
---
apiVersion: batch/v1
kind: Job
metadata:
  namespace: {{ .Release.Namespace }}
  name: "{{ .Release.Name }}-remove-sgconfig"
  labels:
    app: stackgres-operator-cleanup
    job: remove-sgconfig
  annotations:
    "helm.sh/hook": post-delete
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "helm.sh/hook-weight": "10"
    {{- with .Values.jobs.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: stackgres-operator-cleanup
        job: remove-sgconfig
    spec:
      serviceAccountName: {{ .Release.Name }}-init
      restartPolicy: OnFailure
      terminationGracePeriodSeconds: 0
      {{- with .Values.jobs.schedulerName }}
      schedulerName: {{ . }}
      {{- end }}
      {{- with .Values.jobs.runtimeClassName }}
      runtimeClassName: {{ . }}
      {{- end }}
      {{- with .Values.jobs.preemptionPolicy }}
      preemptionPolicy: {{ . }}
      {{- end }}
      {{- with .Values.jobs.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.jobs.affinity}}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end}}
      {{- with .Values.jobs.nodeSelector}}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.jobs.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: "remove-sgconfig"
        image: {{ template "kubectl-image" . }}
        imagePullPolicy: "IfNotPresent"
        {{- with .Values.jobs.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        command:
          - "/bin/bash"
          - "-ecx"
          - |
            ! kubectl get crd sgconfigs.stackgres.io >/dev/null 2>&1 \
              || kubectl delete sgconfig --ignore-not-found -n "{{ .Values.sgConfigNamespace | default .Release.Namespace }}" "{{ .Release.Name }}"
{{- end }}
