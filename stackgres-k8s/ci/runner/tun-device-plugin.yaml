# Advertises /dev/net/tun as the resource squat.ai/tun, so that an unprivileged
# pod can ask for it. Only needed by path 2 of the README, where the job pod
# shares the user namespace of the node and podman has to run rootless: its
# network backend sets up a tap device to reach the network of the pod, and
# without this device it fails with
#
#   Error: setting up Pasta: pasta failed with exit code 1:
#   Failed to open() /dev/net/tun: No such file or directory
#
# Mounting /dev/net/tun with a hostPath is not enough: the device filter of the
# cgroups v2 denies opening the character device 10:200 to a container that did
# not get it from the runtime, and only a device plugin makes the runtime add it.
#
# The privilege stays confined to this daemon set, the job pods it serves are
# unprivileged. That is the whole point of using a device plugin instead of
# making the job pods privileged.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: tun-device-plugin
  namespace: kube-system
  labels:
    app.kubernetes.io/name: tun-device-plugin
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: tun-device-plugin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tun-device-plugin
    spec:
      priorityClassName: system-node-critical
      tolerations:
        - operator: Exists
          effect: NoExecute
        - operator: Exists
          effect: NoSchedule
      nodeSelector:
        kubernetes.io/arch: arm64
      containers:
        # TODO pin to a digest once the path has been decided, this runs on
        # every node of the cluster.
        - name: generic-device-plugin
          image: ghcr.io/squat/generic-device-plugin:latest
          args:
            - --device
            - |
              name: tun
              groups:
                - count: 1000
                  paths:
                    - path: /dev/net/tun
          resources:
            requests:
              cpu: 50m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          securityContext:
            privileged: true
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
            - name: dev
              mountPath: /dev
      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
        - name: dev
          hostPath:
            path: /dev
