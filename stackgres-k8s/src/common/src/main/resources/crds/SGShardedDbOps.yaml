apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sgshardeddbops.stackgres.io
spec:
  group: stackgres.io
  scope: Namespaced
  names:
    kind: SGShardedDbOps
    listKind: SGShardedDbOpsList
    plural: sgshardeddbops
    singular: sgshardeddbops
    shortNames:
      - sgsdo
  versions:
  - name: v1
    served: true
    storage: true
    additionalPrinterColumns:
    - name: cluster
      type: string
      jsonPath: .spec.sgShardedCluster
    - name: operation
      type: string
      jsonPath: .spec.op
    - name: status
      type: string
      jsonPath: .status.conditions[?(@.status=="True")].reason
    - name: started-at
      type: string
      jsonPath: .status.opStarted
      priority: 1
    - name: retries
      type: string
      jsonPath: .status.opRetries
      priority: 1
    schema:
      openAPIV3Schema:
        required: ["metadata", "spec"]
        type: object
        properties:
          metadata:
            type: object
            properties:
              name:
                type: string
                maxLength: 57
                pattern: "^[a-z]([-a-z0-9]*[a-z0-9])?$"
                description: |
                  Name of the Sharded Database Operation. A database operation represents a ""kind"" of operation on a StackGres cluster, classified by a given name. The operation references one SGShardedCluster by its name. Following [Kubernetes naming conventions](https://github.com/kubernetes/community/blob/master/contributors/design-proposals/architecture/identifiers.md), it must be an rfc1035/rfc1123 `label`, an alphanumeric (a-z, and 0-9) string, with the '-' character allowed anywhere except the first or last character.

                  The name must be unique across all database operations in the same namespace."
          spec:
            type: object
            properties:
              sgShardedCluster:
                type: string
                description: |
                  The name of SGShardedCluster on which the operation will be performed.
              scheduling:
                type: object
                description: Pod custom node scheduling and affinity configuration
                properties:
                  nodeSelector:
                    type: object
                    additionalProperties:
                      type: string
                    description: |
                      NodeSelector is a selector which must be true for the pod to fit on a node. Selector which must match a node's labels for the pod to be scheduled on that node. More info: https://kubernetes.io/docs/concepts/configuration/assign-pod-node/
