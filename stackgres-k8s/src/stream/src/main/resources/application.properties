quarkus.banner.enabled=false
quarkus.default-locale=en-US

# Quarkus Native Image
quarkus.native.additional-build-args=\
  -march=compatibility,\
  -H:+UnlockExperimentalVMOptions,\
  -H:IncludeResources=.*/*.properties,\
  -H:+SourceLevelDebug,\
  -H:-DeleteLocalSymbols,\
  -g
quarkus.native.monitoring=jfr

# Logger Production
quarkus.log.level=INFO
quarkus.log.min-level=TRACE
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{2.}] (%t) %s%e%n

# Logger Development
%dev.quarkus.log.level=INFO
%dev.quarkus.log.min-level=TRACE
%dev.quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{4.}] (%t) %s%e%n
%dev.quarkus.log.category."io.stackgres".level=DEBUG
%dev.quarkus.log.category."io.quarkus".level=INFO

%test.quarkus.log.category."okhttp3.mockwebserver".level=WARN

# No test opens a connection: the ones Debezium makes are configured from the
# SGStream and every test mocks them, so the container that the Dev Services start
# for each @QuarkusTest is only paid for. It can not even start where the containers
# share the network namespace of the pod running the job, since Testcontainers waits
# for a published port and there is none to publish.
# restapi keeps them from starting one by configuring the datasource instead.
# See CONTAINER_ENGINE in stackgres-k8s/ci/build.
%test.quarkus.datasource.devservices.enabled=false

# REST client configuration
quarkus.rest-client.follow-redirects=true

# Use custom micrometer producer
quarkus.micrometer.export.prometheus.default-registry=true
