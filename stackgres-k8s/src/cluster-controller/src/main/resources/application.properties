quarkus.banner.enabled=false
quarkus.default-locale=en-US

# Quarkus Native Image
quarkus.native.march=compatibility
quarkus.native.additional-build-args=\
  -R:MinHeapSize=32m,\
  -R:MaxHeapSize=128m,\
  -H:+UnlockExperimentalVMOptions,\
  -H:IncludeResources=.*/*.yaml,\
  -H:IncludeResources=.*/*.sh,\
  -H:IncludeResources=.*/*.sql,\
  -H:IncludeResources=.*/*.properties,\
  -H:IncludeResources=templates/.*,\
  -H:+SourceLevelDebug,\
  -H:-DeleteLocalSymbols,\
  -g
quarkus.native.monitoring=jfr

# Logger Production
quarkus.log.level=INFO
quarkus.log.min-level=TRACE
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{2.}] (%t) %s%e%n

# Logger Development
%dev.quarkus.log.level=INFO
%dev.quarkus.log.min-level=TRACE
%dev.quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{4.}] (%t) %s%e%n
%dev.quarkus.log.category."io.stackgres".level=DEBUG
%dev.quarkus.log.category."io.quarkus".level=INFO

# Authentication
quarkus.http.auth.basic=true

# No test opens a connection: PostgresConnectionManager makes them against the
# PostgreSQL of the pod and every test mocks it, so the container that the Dev
# Services start for each @QuarkusTest is only paid for. It can not even start
# where the containers share the network namespace of the pod running the job,
# since Testcontainers waits for a published port and there is none to publish.
# restapi keeps them from starting one by configuring the datasource instead.
# See CONTAINER_ENGINE in stackgres-k8s/ci/build.
%test.quarkus.datasource.devservices.enabled=false

# jOOQ
org.jooq.no-logo=true
quarkus.log.category."org.jooq.Constants".level=OFF
quarkus.log.category."org.jooq.tools.LoggerListener".level=OFF

# Use custom micrometer producer
quarkus.micrometer.export.prometheus.default-registry=true
