image: null

variables:
  SG_CI_IMAGE_NAME: "ci:1.37"
  BUILDER_IMAGE_NAME: "builder:1.10"
  SKIP_NATIVE: "false"
  SKIP_E2E: "false"
  SKIP_DEPLOY: "false"
  E2E_JOBS: 4
  E2E_EXCLUSIVE_JOBS: 3
  E2E_RETRY: 2
  E2E_FAILURE_RETRY: 3
  ARTIFACT_DOWNLOAD_ATTEMPTS: 3
  EXECUTOR_JOB_SECTION_ATTEMPTS: 3
  GET_SOURCES_ATTEMPTS: 3
  RESTORE_CACHE_ATTEMPTS: 3
  E2E_SHELL: sh
  E2E_ENV: kind
  K8S_VERSION: "1.24"
  LATEST: "false"
  BUILD_UID: 0

stages:
  - pre build
  - pre build multi archs
  - build 1
  - build 2
  - image build
  - image build multi archs
  - test
  - deploy

# Set BUILD_GL_PAGES=true to create a pipeline that only builds and publishes
# GitLab Pages (the jobs in .gitlab-ci/web.yml) — the product includes are
# skipped entirely. See .gitlab-ci/web.yml for usage.
include:
  - local: .gitlab-ci/pre-build.yml
    rules:
      - if: $BUILD_GL_PAGES != "true"
  - local: .gitlab-ci/build.yml
    rules:
      - if: $BUILD_GL_PAGES != "true"
  - local: .gitlab-ci/native-build.yml
    rules:
      - if: $BUILD_GL_PAGES != "true"
  - local: .gitlab-ci/image-build.yml
    rules:
      - if: $BUILD_GL_PAGES != "true"
  - local: .gitlab-ci/test.yml
    rules:
      - if: $BUILD_GL_PAGES != "true"
  - local: .gitlab-ci/e2e-test.yml
    rules:
      - if: $BUILD_GL_PAGES != "true"
  - local: .gitlab-ci/image-release.yml
    rules:
      - if: $BUILD_GL_PAGES != "true"
  - local: .gitlab-ci/deploy.yml
    rules:
      - if: $BUILD_GL_PAGES != "true"
  - local: .gitlab-ci/web.yml

workflow:
  rules:
  - if: |
     $CI_PIPELINE_SOURCE =~ /^(push|schedule|trigger)$/ || $CI_COMMIT_TAG
       || $CI_PIPELINE_SOURCE == 'merge_request_event'
