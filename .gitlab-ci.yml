image: null

variables:
  SG_CI_IMAGE_NAME: "ci:1.38"
  # Container engine used by the jobs. Set to podman for the runners that have
  # no docker daemon reachable, like the ones running the jobs as pods.
  CONTAINER_ENGINE: docker
  # Image used by the jobs that only need a container engine CLI. Must be
  # overridden along with CONTAINER_ENGINE.
  SG_CONTAINER_ENGINE_IMAGE: "docker:29.2.1"
  BUILDER_IMAGE_NAME: "builder:1.10"
  SKIP_NATIVE: "false"
  SKIP_E2E: "false"
  SKIP_DEPLOY: "false"
  E2E_JOBS: 4
  E2E_EXCLUSIVE_JOBS: 3
  E2E_RETRY: 2
  E2E_FAILURE_RETRY: 3
  ARTIFACT_DOWNLOAD_ATTEMPTS: 3
  EXECUTOR_JOB_SECTION_ATTEMPTS: 3
  GET_SOURCES_ATTEMPTS: 3
  RESTORE_CACHE_ATTEMPTS: 3
  E2E_SHELL: sh
  E2E_ENV: kind
  K8S_VERSION: "1.25"
  LATEST: "false"
  BUILD_UID: 0

stages:
  - pre build
  - pre build multi archs
  - build 1
  - build 2
  - image build
  - image build multi archs
  - test
  - deploy

include:
  - local: .gitlab-ci/pre-build.yml
  - local: .gitlab-ci/build.yml
  - local: .gitlab-ci/native-build.yml
  - local: .gitlab-ci/image-build.yml
  - local: .gitlab-ci/test.yml
  - local: .gitlab-ci/e2e-test.yml
  - local: .gitlab-ci/image-release.yml
  - local: .gitlab-ci/deploy.yml

workflow:
  rules:
  - if: |
     $CI_PIPELINE_SOURCE =~ /^(push|schedule|trigger)$/ || $CI_COMMIT_TAG
       || $CI_PIPELINE_SOURCE == 'merge_request_event'
