.pre build image:
  image: $SG_CONTAINER_ENGINE_IMAGE
  stage: pre build
  timeout: 1 hour
  script:
    - |
      [ "$DEBUG" != true ] || set -x
      BUILD_FUNCTIONS="sh $CI_PROJECT_DIR/stackgres-k8s/ci/build/build-functions.sh"
      TARGET_IMAGE_NAME="$CI_REGISTRY/$SG_CI_PROJECT_PATH/$IMAGE_NAME-$ARCH"
      LATEST_TARGET_IMAGE_NAME="$CI_REGISTRY/$SG_CI_PROJECT_PATH/${IMAGE_NAME%:*}:latest-$ARCH"
      mkdir -p $HOME/.docker
      cat "$DOCKER_AUTH_CONFIG" > "$HOME/.docker/config.json"
      unset DOCKER_AUTH_CONFIG
      echo | $BUILD_FUNCTIONS docker_login "$CI_REGISTRY" || \
        $BUILD_FUNCTIONS docker_login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
      cat << EOF > build-image.sh
      if $BUILD_FUNCTIONS docker_manifest_inspect "$TARGET_IMAGE_NAME" 2>/dev/null \
        && [ "$DO_IMAGES" != true ]
      then
        echo "$TARGET_IMAGE_NAME" already exists
        exit
      fi
      echo Building...
      $BUILD_FUNCTIONS docker_build -f "$IMAGE_DOCKERFILE" -t "$TARGET_IMAGE_NAME" -t "$LATEST_TARGET_IMAGE_NAME" .
      echo ...done
      echo Pushing...
      $BUILD_FUNCTIONS docker_push "$TARGET_IMAGE_NAME"
      $BUILD_FUNCTIONS docker_push "$LATEST_TARGET_IMAGE_NAME"
      echo ...done
      EOF
      flock "/tmp/stackgres-build-$IMAGE_NAME" sh -xe build-image.sh
  retry: 2

.pre build image multi archs:
  image: $SG_CONTAINER_ENGINE_IMAGE
  tags:
    - stackgres-runner-v2
  stage: pre build multi archs
  timeout: 1 hour
  script:
    - |
      [ "$DEBUG" != true ] || set -x
      BUILD_FUNCTIONS="sh $CI_PROJECT_DIR/stackgres-k8s/ci/build/build-functions.sh"
      TARGET_IMAGE_NAME="$CI_REGISTRY/$SG_CI_PROJECT_PATH/$IMAGE_NAME"
      LATEST_TARGET_IMAGE_NAME="$CI_REGISTRY/$SG_CI_PROJECT_PATH/${IMAGE_NAME%:*}:latest"
      mkdir -p $HOME/.docker
      cat "$DOCKER_AUTH_CONFIG" > "$HOME/.docker/config.json"
      unset DOCKER_AUTH_CONFIG
      echo | $BUILD_FUNCTIONS docker_login "$CI_REGISTRY" || \
        $BUILD_FUNCTIONS docker_login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
      ARCH_LIST="amd64 $(
        if [ "$DO_ARM" = true ] \
          || { [ "$SKIP_ARM" != true ] && [ -n "$CI_COMMIT_TAG" ]; }
        then
          echo arm64
        fi
        )"
      if $BUILD_FUNCTIONS docker_manifest_inspect "$TARGET_IMAGE_NAME" >/dev/null 2>&1 \
        && [ "$DO_IMAGES" != true ]
      then
        exit
      fi
      for ARCH in $ARCH_LIST
      do
        $BUILD_FUNCTIONS docker_pull "$TARGET_IMAGE_NAME-$ARCH"
        $BUILD_FUNCTIONS docker_pull "$LATEST_TARGET_IMAGE_NAME-$ARCH"
      done
      $BUILD_FUNCTIONS docker_pull "$CI_REGISTRY/$SG_CI_PROJECT_PATH/placeholder"
      $BUILD_FUNCTIONS docker_tag "$CI_REGISTRY/$SG_CI_PROJECT_PATH/placeholder" "$TARGET_IMAGE_NAME"
      $BUILD_FUNCTIONS docker_push "$TARGET_IMAGE_NAME"
      $BUILD_FUNCTIONS docker_tag "$CI_REGISTRY/$SG_CI_PROJECT_PATH/placeholder" "$LATEST_TARGET_IMAGE_NAME"
      $BUILD_FUNCTIONS docker_push "$LATEST_TARGET_IMAGE_NAME"
      $BUILD_FUNCTIONS docker_manifest_rm "$TARGET_IMAGE_NAME" 2>/dev/null || true
      $BUILD_FUNCTIONS docker_manifest_create "$TARGET_IMAGE_NAME" $(
        for ARCH in $ARCH_LIST
        do
          echo "$TARGET_IMAGE_NAME-$ARCH "
        done)
      $BUILD_FUNCTIONS docker_manifest_push "$TARGET_IMAGE_NAME"
      $BUILD_FUNCTIONS docker_manifest_rm "$LATEST_TARGET_IMAGE_NAME" 2>/dev/null || true
      $BUILD_FUNCTIONS docker_manifest_create "$LATEST_TARGET_IMAGE_NAME" $(
        for ARCH in $ARCH_LIST
        do
          echo "$LATEST_TARGET_IMAGE_NAME-$ARCH "
        done)
      $BUILD_FUNCTIONS docker_manifest_push "$LATEST_TARGET_IMAGE_NAME"
  retry: 2

build ci image amd64:
  extends: .pre build image
  tags:
    - stackgres-runner-v2
    - linux-amd64
  variables:
    IMAGE_NAME: $SG_CI_IMAGE_NAME
    ARCH: 'amd64'
    IMAGE_DOCKERFILE: stackgres-k8s/ci/build/Dockerfile-ci

build ci image arm64:
  extends: .pre build image
  tags:
    - stackgres-runner-v2
    - linux-arm64
  variables:
    IMAGE_NAME: $SG_CI_IMAGE_NAME
    ARCH: 'arm64'
    IMAGE_DOCKERFILE: stackgres-k8s/ci/build/Dockerfile-ci
  rules:
  - if: |
     ( ( $CI_PIPELINE_SOURCE =~ /^(push|schedule|trigger)$/ || $CI_COMMIT_TAG
       || $CI_PIPELINE_SOURCE == 'merge_request_event' )
       && (
        ( $SKIP_ARM != "true" && $CI_COMMIT_TAG )
        || $DO_ARM ) )

build builder image amd64:
  extends: .pre build image
  tags:
    - stackgres-runner-v2
    - linux-amd64
  variables:
    IMAGE_NAME: $BUILDER_IMAGE_NAME
    ARCH: 'amd64'
    IMAGE_DOCKERFILE: stackgres-k8s/ci/build/Dockerfile-builder

build builder image arm64:
  extends: .pre build image
  tags:
    - stackgres-runner-v2
    - linux-arm64
  variables:
    IMAGE_NAME: $BUILDER_IMAGE_NAME
    ARCH: 'arm64'
    IMAGE_DOCKERFILE: stackgres-k8s/ci/build/Dockerfile-builder
  rules:
  - if: |
     ( ( $CI_PIPELINE_SOURCE =~ /^(push|schedule|trigger)$/ || $CI_COMMIT_TAG
       || $CI_PIPELINE_SOURCE == 'merge_request_event' )
       && (
        ( $SKIP_ARM != "true" && $CI_COMMIT_TAG )
        || $DO_ARM ) )

build ci image multi archs:
  extends: .pre build image multi archs
  tags:
    - stackgres-runner-v2
  variables:
    IMAGE_NAME: $SG_CI_IMAGE_NAME

build builder image multi archs:
  extends: .pre build image multi archs
  tags:
    - stackgres-runner-v2
  variables:
    IMAGE_NAME: $BUILDER_IMAGE_NAME
