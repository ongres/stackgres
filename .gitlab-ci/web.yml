# Build and publish the unified website under web/ (see web/SITES_MERGE_PLAYBOOK.md).
#
# Jobs run only when web/** (or this file) changes, so product pipelines are
# unaffected:
#   - "build web": every branch — builds the site and keeps web/public as a
#     job artifact (browsable via GitLab's artifact browser, members-only).
#   - "pages": the website branch only — rebuilds against $CI_PAGES_URL and
#     publishes to GitLab Pages. Who can view Pages follows the project's
#     Pages access control (Settings → General → Visibility).
#
# BUILD_GL_PAGES flag: by default these jobs run inside the full product
# pipeline, and "pages" (deploy stage) waits for the earlier stages to
# succeed. Set BUILD_GL_PAGES=true to get a GitLab-Pages-only pipeline
# instead — the product includes are skipped at include level (see
# .gitlab-ci.yml), so Pages builds and publishes without running or waiting on
# the product jobs. Ways to set it:
#   - one-off:    CI/CD → Pipelines → "New pipeline" → variable BUILD_GL_PAGES=true
#   - with push:  git push -o ci.variable="BUILD_GL_PAGES=true"
#   - permanent:  Settings → CI/CD → Variables → BUILD_GL_PAGES=true
# The website build has no dependency on product-job artifacts: it uses the
# committed web/ content plus the catalog API fetch below.
#
# Hugo is installed pinned from GitHub releases instead of using a hugomods
# image: the build also runs web/scripts/fetch-catalog.py, which needs python3,
# and the hugomods images don't guarantee it.

.web hugo:
  image: python:3.12-slim
  variables:
    HUGO_VERSION: "0.152.2"
  tags:
    - stackgres-runner-v2
    - linux-amd64
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends curl ca-certificates git
    - curl -fsSL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" | tar -xz -C /usr/local/bin hugo
    - hugo version
    # API failure must not fail the build — falls back to the committed snapshot
    - python3 web/scripts/fetch-catalog.py || echo "API unreachable — building from committed snapshot"
  retry:
    max: 2
    when: [ unknown_failure, api_failure, stuck_or_timeout_failure, runner_system_failure, runner_unsupported,
     stale_schedule, job_execution_timeout, archived_failure, unmet_prerequisites, scheduler_failure, data_integrity_failure ]

build web:
  extends: .web hugo
  stage: test
  needs: []
  rules:
    - changes:
        - web/**/*
        - .gitlab-ci/web.yml
  script:
    # baseURL "/" so the artifact browses correctly via GitLab's artifact browser
    - hugo --source web --minify --baseURL "/"
  artifacts:
    expire_in: 14 days
    paths:
      - web/public

pages:
  extends: .web hugo
  stage: deploy
  needs: []
  rules:
    - if: $CI_COMMIT_BRANCH == "wip-unified-stackgres-website"
      changes:
        - web/**/*
        - .gitlab-ci/web.yml
  script:
    # Generate the docs content derived from the operator sources (CRD
    # reference, helm parameters, data files, swagger). The swagger is a
    # snapshot downloaded from the live site — acceptable for this PREVIEW
    # only; a production build must provide the real swagger-merged.yaml from
    # the operator build instead (see web/scripts/generate-docs.sh).
    - curl -fsSL "https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64" -o /usr/local/bin/yq && chmod +x /usr/local/bin/yq
    - curl -fsSL "https://github.com/fybrik/crdoc/releases/download/v0.6.4/crdoc_Linux_x86_64.tar.gz" | tar -xz -C /usr/local/bin crdoc
    - curl -fsSL "https://github.com/norwoodj/helm-docs/releases/download/v1.14.2/helm-docs_1.14.2_Linux_x86_64.tar.gz" | tar -xz -C /usr/local/bin helm-docs
    - SG_SWAGGER_DOWNLOAD_URL="https://stackgres.io/doc/latest/sg-swagger.yaml" sh web/scripts/generate-docs.sh
    # Pages serves the site under the project subpath (or a unique domain);
    # $CI_PAGES_URL is correct in both cases.
    - hugo --source web --minify --baseURL "$CI_PAGES_URL"
    # GitLab Pages publishes the artifact directory named "public" at repo root
    - mv web/public public
  artifacts:
    paths:
      - public
  environment:
    name: web-preview
    url: $CI_PAGES_URL
