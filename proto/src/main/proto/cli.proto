syntax = "proto3";

option java_multiple_files = true;
option java_package = "io.stackgres.proto.cli";
option java_outer_classname = "Protocol";

package cli;

import "common.proto";
import "google/rpc/status.proto";
import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";


// CLI Cluster Service

service ClusterService {
  rpc CreateCluster(CreateClusterRequest) returns (stream CreateClusterResponse);
  rpc DeleteCluster(DeleteClusterRequest) returns (stream DeleteClusterResponse);
  rpc ListClusters(ListClustersRequest) returns (ListClustersResponse);
  rpc GetCluster(GetClusterRequest) returns (GetClusterResponse);
  rpc ListVersions(ListVersionsRequest) returns (ListVersionsResponse);
  rpc ListExtensions(ListExtensionsRequest) returns (ListExtensionsResponse);
  rpc ExecInCluster(stream CliExecMessage) returns (stream MatriarchExecMessage);
  rpc GetClusterLogs(GetClusterLogsRequest) returns (GetClusterLogsResponse);
  rpc TailClusterLogs(stream TailClusterLogsRequest) returns (stream TailClusterLogsResponse);
  rpc PgWireTunnel(stream PgWireClientMessage) returns (stream PgWireServerMessage);
  rpc GetClusterEvents(GetClusterEventsRequest) returns (GetClusterEventsResponse);
  rpc GetClusterDiagnostics(GetClusterDiagnosticsRequest) returns (GetClusterDiagnosticsResponse);
  rpc GetClusterCheckpoints(GetClusterCheckpointsRequest) returns (GetClusterCheckpointsResponse);
  rpc StartCluster(StartClusterRequest) returns (StartClusterResponse);
  rpc StopCluster(StopClusterRequest) returns (StopClusterResponse);
  rpc RestartCluster(RestartClusterRequest) returns (RestartClusterResponse);
}

message CreateClusterRequest {
  optional string name = 1;
  optional string version = 2;
  optional string username = 3;
  optional string password = 4;
  repeated CreateInstance instance = 5;
  repeated CreateExtension extension = 6;
  map<string, string> tags = 7;
  // Slony-Linux
  bool standalone = 8;
  TlsConfig tls = 9;
  common.Flavor flavor = 10;
  map<string, string> nodeSelector = 11;
}

message TlsConfig {
  oneof mode {
    SelfSignedCerts selfSignedCerts = 1;
    ProvidedCerts providedCerts = 2;
    NoTls noTls = 3;
  }
}

message SelfSignedCerts {}

message ProvidedCerts {
  bytes certificate = 1;
  bytes privateKey = 2;
}

message NoTls {}

message CreateInstance {
  optional uint32 port = 1;
  optional string listenAddress = 2;
  // Slony-Linux
  optional common.UUID slonyId = 3;
  optional string configPath = 4;
  optional string dataDir = 5;
  optional string logDir = 6;
  optional string walDir = 7;
  repeated VolumeMount volumeMount = 8;
  // Slony-Kubernetes
  optional Disk dataDisk = 9;
  optional Disk logDisk = 10;
  optional Disk walDisk = 11;
  repeated VolumeDisk volumeDisk = 12;
  optional uint32 ivorySqlPort = 13;
}

message CreateExtension {
  string name = 1;
  optional string version = 2;
  optional string revision = 3;
}

message Extension {
  string name = 1;
  string version = 2;
  string revision = 3;
}

message VolumeMount {
  string hostPath = 1;
  string mountPath = 2;
}

message VolumeDisk {
  string mountPath = 1;
  Disk disk = 2;
}

message Disk {
  uint64 size = 1;
  optional string storageClass = 2;
}

message CreateClusterResponse {
  oneof response {
    google.rpc.Status status = 1;
    ClusterUpdate update = 2;
  }
}

message ClusterUpdate {
  enum ClusterUpdateType {
    CREATED = 0;
    HEALTHY = 2;
  }
  enum ClusterInstanceUpdateType {
    NODE_CREATED = 0;
    IMAGE_DOWNLOADED = 1;
    DB_INITIALIZED = 2;
    NODE_STARTED = 3;
    NODE_HEALTHY = 4;
  }

  optional common.UUID id = 1;
  optional string name = 2;
  optional string password = 3;
  oneof update {
    ClusterUpdateType clusterUpdate = 4;
    ClusterInstanceUpdateType instanceUpdate = 5;
  }
  repeated google.protobuf.Any details = 6;
}

message DeleteClusterRequest {
  oneof target {
    common.UUID id = 1;
    bool all = 2;
    // oneof can't define map<> directly
    ClusterRequestTags tags = 3;
  }
}

message ClusterRequestTags {
  map<string, string> tags = 1;
}

message DeleteClusterResponse {
  oneof response {
    google.rpc.Status status = 1;
    ClusterDeleted deleted = 2;
  }
}

message ClusterDeleted {
  common.UUID id = 1;
  string name = 2;
}

message ListClustersRequest {
  map<string, string> tags = 1;
}

message GetClusterRequest {
  oneof target {
    common.UUID id = 1;
    string name = 2;
  }
}

message GetClusterResponse {
  oneof response {
    google.rpc.Status status = 1;
    Cluster cluster = 2;
  }
}

message GetClusterDiagnosticsRequest {
  string name = 1;
}

message GetClusterDiagnosticsResponse {
  oneof response {
    google.rpc.Status status = 1;
    ClusterDiagnostics diagnostics = 2;
  }
}

message ClusterDiagnostics {
  repeated InstanceDiagnostics instance = 1;
}

message InstanceDiagnostics {
  common.UUID id = 1;
  string name = 2;
  optional string pgControlData = 3;
  optional int64 receivedAt = 4;
  optional string imageName = 5;
  optional string imageDigest = 6;
}

message StartClusterRequest {
  oneof target {
    common.UUID id = 1;
    bool all = 2;
    ClusterRequestTags tags = 3;
  }
}
message StartClusterResponse {
  google.rpc.Status status = 1;
}

message StopClusterRequest {
  oneof target {
    common.UUID id = 1;
    bool all = 2;
    ClusterRequestTags tags = 3;
  }
}
message StopClusterResponse {
  google.rpc.Status status = 1;
}

message RestartClusterRequest {
  oneof target {
    common.UUID id = 1;
    bool all = 2;
    ClusterRequestTags tags = 3;
  }
}
message RestartClusterResponse {
  google.rpc.Status status = 1;
}

message Cluster {
  common.UUID id = 1;
  string name = 2;
  string username = 3;
  string password = 4;
  repeated ClusterInstance instance = 5;
  repeated Extension extension = 6;
  map<string, string> tags = 7;
  // Slony-Linux
  bool standalone = 8;
  common.Flavor flavor = 9;
}

message ClusterInstance {
  common.UUID id = 1;
  string name = 2;
  string version = 3;
  ClusterStatus status = 4;
  optional uint32 port = 5;
  string listenAddress = 6;
  // Slony-Linux
  optional common.UUID slonyId = 7;
  optional string configPath = 8;
  optional string dataDir = 9;
  optional string logDir = 10;
  optional string walDir = 11;
  repeated VolumeMount volumeMount = 12;
  // Slony-Kubernetes
  optional Disk dataDisk = 13;
  optional Disk logDisk = 14;
  optional Disk walDisk = 15;
  repeated VolumeDisk volumeDisk = 16;
  double cpu = 17;
  uint64 memory = 18;
  uint64 dbSize = 19;
  ReplicationStatus replicationStatus = 20;
  string externalAddress = 21;
  common.Flavor flavor = 22;
  optional uint32 ivorySqlPort = 23;
}

enum ReplicationStatus {
  REPLICATION_STATUS_UNKNOWN = 0;
  REPLICATION_STATUS_STANDALONE = 1;
  REPLICATION_STATUS_PRIMARY = 2;
  REPLICATION_STATUS_REPLICA = 3;
}

enum ClusterStatus {
  STATUS_CREATED = 0;
  STATUS_INITDB = 1;
  STATUS_STARTED = 2;
  STATUS_HEALTHY = 4;
  STATUS_FAILED = 5;
  STATUS_STOPPED = 6;
  STATUS_UNKNOWN = 7;
}

message ClusterInformation {
  string name = 1;
  common.UUID id = 2;
  string version = 3;
  optional uint32 port = 4;
  ClusterStatus status = 5;
  map<string, string> tags = 6;
  double cpu = 7;
  uint64 memory = 8;
  uint64 dbSize = 9;
  common.Flavor flavor = 10;
  optional uint32 ivorySqlPort = 11;
}

message ListClustersResponse {
  repeated ClusterInformation clusterInformation = 1;
}

message ListVersionsRequest {
  common.Flavor flavor = 1;
}

message ListVersionsResponse {
  repeated string version = 1;
}

message ListExtensionsRequest {
  string version = 1;
  common.Flavor flavor = 2;
}

message ListExtensionsResponse {
  repeated Extension extension = 1;
}

message CliExecMessage {
  oneof kind {
    ExecCommand execCommand = 1;
    bytes bytes = 2;
  }
}

message ExecCommand {
  common.UUID clusterId = 1;
  optional common.UUID instanceId = 2;
  repeated string command = 3;
}

message MatriarchExecMessage {
  oneof response {
    google.rpc.Status status = 1;
    bytes bytes = 2;
    uint32 exitCode = 3;
  }
}

enum LogComponent {
  LOG_COMPONENT_POSTGRES = 0;
  LOG_COMPONENT_PATRONI = 1;
  LOG_COMPONENT_SLON = 2;
  LOG_COMPONENT_ETCD = 3;
}

message GetClusterLogsRequest {
  common.UUID clusterId = 1;
  optional common.UUID instanceId = 2;
  LogComponent component = 3;
}

message GetClusterLogsResponse {
  oneof response {
    google.rpc.Status status = 1;
    string logs = 2;
  }
}

message TailClusterLogsRequest {
  common.UUID clusterId = 1;
  optional common.UUID instanceId = 2;
  LogComponent component = 3;
}

message TailClusterLogsResponse {
  oneof response {
    google.rpc.Status status = 1;
    string line = 2;
  }
}

message PgWireClientMessage {
  oneof kind {
    PgWireTunnelOpen open = 1;
    PgWireTunnelData data = 2;
    PgWireTunnelCloseRequest close = 3;
  }
}

message PgWireServerMessage {
  oneof kind {
    PgWireTunnelOpened opened = 1;
    PgWireTunnelData data = 2;
    PgWireTunnelClosed closed = 3;
    PgWireTunnelAborted aborted = 4;
  }
}

message PgWireTunnelOpen {
  common.UUID clusterId = 1;
  optional common.UUID instanceId = 2;
  PgWireTarget target = 3;
}

enum PgWireTarget {
  PG_WIRE_TARGET_POSTGRES = 0;
  PG_WIRE_TARGET_IVORY_SQL = 1;
}

message PgWireTunnelOpened {}

message PgWireTunnelData {
  bytes data = 1;
}

message PgWireTunnelCloseRequest {}

message PgWireTunnelClosed {}

message PgWireTunnelAborted {
  string reason = 1;
}


// CLI Resource Service

service ResourceService {
  rpc ListSlonys(ListSlonysRequest) returns (ListSlonysResponse);
  rpc ListSlons(ListSlonsRequest) returns (ListSlonsResponse);
  rpc ListK8s(ListK8sRequest) returns (ListK8sResponse);
  rpc DeleteSlony(DeleteSlonyRequest) returns (stream DeleteSlonyResponse);
  rpc AddNodeTags(AddNodeTagsRequest) returns (AddNodeTagsResponse);
  rpc RemoveNodeTags(RemoveNodeTagsRequest) returns (RemoveNodeTagsResponse);
  rpc GetNodeLogs(GetNodeLogsRequest) returns (GetNodeLogsResponse);
  rpc TailNodeLogs(stream TailNodeLogsRequest) returns (stream TailNodeLogsResponse);
  rpc GetNodeEvents(GetNodeEventsRequest) returns (GetNodeEventsResponse);
}

message GetNodeLogsRequest {
  common.UUID slonyId = 1;
}

message GetNodeLogsResponse {
  oneof response {
    google.rpc.Status status = 1;
    string logs = 2;
  }
}

message TailNodeLogsRequest {
  common.UUID slonyId = 1;
}

message TailNodeLogsResponse {
  oneof response {
    google.rpc.Status status = 1;
    string line = 2;
  }
}

message ListSlonysRequest {
  map<string, string> tags = 1;
}
message ListSlonysResponse {
  repeated Slony slony = 1;
}
message Slony {
  common.UUID id = 1;
  string hostname = 2;
  string os = 3;
  string arch = 4;
  string version = 5;
  double cpu = 6;
  uint64 memory = 7;
  optional string cloud = 8;
  optional string region = 9;
  optional string availabilityZone = 10;
  optional string computeInstanceName = 11;
  SlonyStatus status = 12;
  google.protobuf.Timestamp lastHeartbeat = 13;
  map<string, string> tags = 14;
}

enum SlonyStatus {
  SLONY_STATUS_ACTIVE = 0;
  SLONY_STATUS_INACTIVE = 1;
  SLONY_STATUS_DISCONNECTED = 2;
}

message DeleteSlonyRequest {
  common.UUID id = 1;
}

message DeleteSlonyResponse {
  oneof response {
    google.rpc.Status status = 1;
    SlonyDeleted deleted = 2;
  }
}

message SlonyDeleted {
  string hostname = 1;
}

message AddNodeTagsRequest {
  common.UUID id = 1;
  map<string, string> tags = 2;
}

message AddNodeTagsResponse {
  google.rpc.Status status = 1;
  map<string, string> currentTags = 2;
}

message RemoveNodeTagsRequest {
  common.UUID id = 1;
  repeated string key = 2;
}

message RemoveNodeTagsResponse {
  google.rpc.Status status = 1;
  map<string, string> currentTags = 2;
}

message ListSlonsRequest {}
message ListSlonsResponse {
  repeated Slon slon = 1;
}
message Slon {
  common.UUID id = 1;
  uint32 port = 2;
  string name = 3;
  string os = 4;
  string arch = 5;
  string version = 6;
  double cpu = 7;
  uint64 memory = 8;
}

message ListK8sRequest {}
message ListK8sResponse {
  // not implemented yet
}

message Event {
  int64 timestamp = 1;
  string scope = 2;
  common.UUID scopeId = 3;
  string type = 4;
  map<string, string> data = 5;
}

message GetClusterEventsRequest {
  string name = 1;
}

message GetClusterEventsResponse {
  oneof response {
    google.rpc.Status status = 1;
    ClusterEvents events = 2;
  }
}

message ClusterEvents {
  repeated Event event = 1;
}

enum SortDirection {
  SORT_DIRECTION_UNSPECIFIED = 0;
  SORT_DIRECTION_ASC = 1;
  SORT_DIRECTION_DESC = 2;
}

message GetClusterCheckpointsRequest {
  common.UUID clusterId = 1;
  optional common.UUID instanceId = 2;
  // Empty string for no filter.
  string database = 3;
  // Inclusive lower bound; exclusive upper bound.
  google.protobuf.Timestamp start = 4;
  google.protobuf.Timestamp end = 5;
  // 0 = server default; capped server-side.
  uint32 maxResults = 6;
  SortDirection direction = 7;
}

message GetClusterCheckpointsResponse {
  oneof response {
    google.rpc.Status status = 1;
    ClusterCheckpoints checkpoints = 2;
  }
}

message ClusterCheckpoints {
  repeated Checkpoint checkpoint = 1;
  // True if the underlying SELECT returned exactly maxResults rows; the
  // client paginates by re-querying with start=last.timestamp (forward) or
  // end=first.timestamp (reverse).
  bool truncated = 2;
}

message Checkpoint {
  google.protobuf.Timestamp timestamp = 1;
  common.UUID instanceId = 2;
  string database = 3;
  uint32 buffersWritten = 4;
  double writeSeconds = 5;
  double syncSeconds = 6;
  double totalSeconds = 7;
}

message GetNodeEventsRequest {
  common.UUID slonyId = 1;
}

message GetNodeEventsResponse {
  oneof response {
    google.rpc.Status status = 1;
    NodeEvents events = 2;
  }
}

message NodeEvents {
  repeated Event event = 1;
}


// CLI Account Service

service AccountService {
  rpc GetAccount(GetAccountRequest) returns (GetAccountResponse);
}

message GetAccountRequest {
}

message GetAccountResponse {
  string user = 1;
}